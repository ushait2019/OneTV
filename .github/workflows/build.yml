name: OneTV Android Debug APK (Autodetect Source)

on:
  workflow_dispatch:
  push:
    branches: [main, master, dev-live]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate OneTV Android project (root, nested, or ZIP)
        id: locate
        shell: bash
        run: |
          set -Eeuo pipefail
          is_project() {
            local dir="$1"
            [[ -f "$dir/settings.gradle.kts" || -f "$dir/settings.gradle" ]] &&
            [[ -f "$dir/app/build.gradle.kts" || -f "$dir/app/build.gradle" ]]
          }
          locate_project() {
            local base="$1" settings candidate
            if is_project "$base"; then
              PROJECT_DIR="$base"
              return 0
            fi
            while IFS= read -r -d '' settings; do
              candidate="$(dirname "$settings")"
              if is_project "$candidate"; then
                PROJECT_DIR="$candidate"
                return 0
              fi
            done < <(find "$base" -maxdepth 8 -type f           \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print0)
            return 1
          }
          
          PROJECT_DIR=""
          if ! locate_project "$GITHUB_WORKSPACE"; then
            echo 'No expanded Android project found; checking uploaded ZIP archives...'
            archive_index=0
            while IFS= read -r -d '' archive; do
              archive_index=$((archive_index + 1))
              target="$RUNNER_TEMP/onetv-android-source-$archive_index"
              mkdir -p "$target"
              echo "Inspecting archive: ${archive#"$GITHUB_WORKSPACE"/}"
              if unzip -qq "$archive" -d "$target"; then
                if locate_project "$target"; then break; fi
              else
                echo "Skipping invalid ZIP archive: $archive" >&2
              fi
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 6 -type f -iname '*.zip' -print0)
          fi
          if [[ -z "$PROJECT_DIR" ]]; then
            echo 'ERROR: Android project root not found.' >&2
            echo 'Expected settings.gradle.kts + app/build.gradle.kts together.' >&2
            echo 'Upload/extract the OneTV Android Studio SOURCE ZIP, not the backend JS ZIP.' >&2
            echo 'Repository top-level files:' >&2
            ls -la "$GITHUB_WORKSPACE" | head -50
            exit 1
          fi
          echo "Found OneTV Android project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "### OneTV Android source" >> "$GITHUB_STEP_SUMMARY"
          echo "Found project: \`$PROJECT_DIR\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK (no deprecated tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Gradle project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew --version

      - name: Build OneTV Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        env:
          ONETV_BACKEND_URL: ${{ secrets.ONETV_BACKEND_URL }}
        run: |
          set -Eeuo pipefail
          ./gradlew --no-daemon --stacktrace \
            -PbackendUrl="$ONETV_BACKEND_URL" \
            :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OneTV-Debug-${{ github.run_number }}
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
