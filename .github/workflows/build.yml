name: Build One TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract One TV project
        run: |
          mkdir -p onetv-project
          unzip -o OneTV-GitHub-Ready.zip -d onetv-project

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version
          adb version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build One TV Debug APK
        working-directory: onetv-project/OneTV-GitHub-Ready
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Find APK
        run: |
          find onetv-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneTV-debug-apk
          path: onetv-project/OneTV-GitHub-Ready/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
