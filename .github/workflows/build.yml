name: Build One TV Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find One TV ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract One TV project
        run: |
          rm -rf onetv-project
          mkdir -p onetv-project
          unzip -q "$ZIP_FILE" -d onetv-project

          echo "Extracted files:"
          find onetv-project -maxdepth 3 -type f | sort

      - name: Detect Android project root
        run: |
          PROJECT_DIR=$(find onetv-project \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          echo "Android project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ONETV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ONETV_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/OneTV-release.keystore"

          test -s "$RUNNER_TEMP/OneTV-release.keystore"

          echo "Release keystore prepared."

      - name: Build unsigned Release APK and AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Find Release outputs
        run: |
          echo "Release APK:"
          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          echo "Release AAB:"
          find "$PROJECT_DIR/app/build/outputs/bundle" \
            -type f \
            -name "*.aab" \
            -print

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ONETV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONETV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONETV_KEY_PASSWORD }}
        run: |
          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            "$APK_FILE" \
            "$RUNNER_TEMP/OneTV-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/OneTV-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/OneTV-release.apk" \
            "$RUNNER_TEMP/OneTV-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/OneTV-release.apk"

      - name: Sign Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ONETV_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ONETV_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONETV_KEY_ALIAS }}
        run: |
          AAB_FILE=$(find "$PROJECT_DIR/app/build/outputs/bundle/release" \
            -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          jarsigner \
            -keystore "$RUNNER_TEMP/OneTV-release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          cp "$AAB_FILE" "$RUNNER_TEMP/OneTV-release.aab"

      - name: Upload One TV Release files
        uses: actions/upload-artifact@v4
        with:
          name: OneTV-release
          path: |
            ${{ runner.temp }}/OneTV-release.apk
            ${{ runner.temp }}/OneTV-release.aab
          if-no-files-found: error
