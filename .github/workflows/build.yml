name: Build One TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check ZIP file
        run: |
          ls -lh
          test -f OneTV-FRESH.zip

      - name: Extract One TV project
        run: |
          rm -rf onetv-project
          mkdir onetv-project
          unzip -q OneTV-FRESH.zip -d onetv-project
          echo "Extracted files:"
          find onetv-project -maxdepth 3 -type f | sort

      - name: Detect Android project root
        run: |
          PROJECT_DIR=$(find onetv-project -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android environment
        run: |
          java -version
          sdkmanager --version
          adb version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build One TV Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: Upload One TV APK
        uses: actions/upload-artifact@v4
        with:
          name: OneTV-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
